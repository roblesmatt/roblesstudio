<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robles Studio — 3D Workspace</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="studio-app" class="studio-shell">
      <!-- Viewport / Grade 3D -->
      <main id="viewport" class="viewport" aria-label="Área de visualização 3D">
        <canvas id="scene-canvas" class="scene-canvas"></canvas>

        <!-- Topo esquerdo: Primitivas / Ferramentas de criação -->
        <nav class="hud-pill hud-top-left" aria-label="Primitivas e criação">
          <button
            type="button"
            class="tool-btn"
            data-tool="grid-menu"
            title="Grade e layouts"
          >
            ⊞
          </button>
          <button
            type="button"
            class="tool-btn"
            data-tool="prim-sphere"
            title="Esfera"
          >
            ◯
          </button>
          <button
            type="button"
            class="tool-btn"
            data-tool="prim-cylinder"
            title="Cilindro"
          >
            ⬭
          </button>
          <button
            type="button"
            class="tool-btn"
            data-tool="prim-box"
            title="Caixa / Embalagem"
          >
            ⬚
          </button>
          <button
            type="button"
            class="tool-btn is-active"
            data-tool="prim-hex"
            title="Forma base"
          >
            ⬣
          </button>
        </nav>

        <!-- Topo centro: Câmera / Seleção / Modos -->
        <nav
          class="hud-pill hud-top-center"
          aria-label="Modos de navegação e seleção"
        >
          <button
            type="button"
            class="tool-btn"
            data-mode="orbit"
            title="Órbita / Câmera"
          >
            🌐
          </button>
          <button
            type="button"
            class="tool-btn is-active"
            data-mode="select"
            title="Seleção"
          >
            ◎
          </button>
          <button type="button" class="tool-btn" data-mode="face" title="Faces">
            ◔
          </button>
          <button
            type="button"
            class="tool-btn"
            data-mode="edge"
            title="Arestas"
          >
            ◫
          </button>
          <button
            type="button"
            class="tool-btn"
            data-mode="vertex"
            title="Vértices"
          >
            ◈
          </button>
        </nav>

        <!-- Topo direito: Luzes / Materiais / Visualização -->
        <nav
          class="hud-pill hud-top-right"
          aria-label="Iluminação e visualização"
        >
          <button
            type="button"
            class="tool-btn"
            data-view="light"
            title="Iluminação"
          >
            ☀
          </button>
          <button
            type="button"
            class="tool-btn"
            data-view="solid"
            title="Sólido"
          >
            ▣
          </button>
          <button
            type="button"
            class="tool-btn"
            data-view="wireframe"
            title="Malha"
          >
            ❖
          </button>
          <button
            type="button"
            class="tool-btn"
            data-view="material"
            title="Material"
          >
            ✺
          </button>
          <button
            type="button"
            class="tool-btn"
            data-view="environment"
            title="Ambiente"
          >
            ✳
          </button>
          <button
            type="button"
            class="tool-btn"
            data-view="settings"
            title="Configurações"
          >
            ⚙
          </button>
        </nav>

        <!-- Lateral esquerda: Transformação e manipulação -->
        <aside
          class="hud-pill hud-left"
          aria-label="Ferramentas de manipulação"
        >
          <button
            type="button"
            class="tool-btn"
            data-action="pan"
            title="Mover câmera / mão"
          >
            ✋
          </button>
          <button
            type="button"
            class="tool-btn"
            data-action="transform"
            title="Transformar (Mover / Rotacionar / Escalar)"
          >
            ✥
          </button>
          <button
            type="button"
            class="tool-btn"
            data-action="align"
            title="Alinhar / Centro"
          >
            ⊕
          </button>
          <button
            type="button"
            class="tool-btn"
            data-action="hierarchy"
            title="Estrutura / Nós"
          >
            ⑂
          </button>
        </aside>
      </main>
    </div>

    <script src="icons.js"></script>
    <script>
      (() => {
        if (!window.RoblesIcons || typeof window.RoblesIcons.get !== "function")
          return;

        const map = [
          ['[data-tool="prim-sphere"]', "sculptSphereBase"],
          ['[data-tool="prim-cylinder"]', "primCylinder"],
          ['[data-tool="prim-box"]', "primCardBox"],
          ['[data-tool="prim-hex"]', "sub3dHardSurface"],
          ['[data-mode="orbit"]', "rtCameraTurntable"],
          ['[data-mode="select"]', "selectPointer"],
          ['[data-mode="face"]', "hsSelFaces"],
          ['[data-mode="edge"]', "hsSelEdges"],
          ['[data-mode="vertex"]', "hsSelVertices"],
          ['[data-view="light"]', "sub3dRender"],
          ['[data-view="solid"]', "primCube"],
          ['[data-view="wireframe"]', "hsToggleWire"],
          ['[data-view="material"]', "shApothecaryBeige"],
          ['[data-view="environment"]', "hdriStudioWarm"],
          ['[data-action="transform"]', "move", "vector"],
          ['[data-action="align"]', "pivot", "vector"],
          ['[data-action="hierarchy"]', "nodes", "vector"],
        ];

        map.forEach(([selector, key, group]) => {
          const btn = document.querySelector(selector);
          const html = window.RoblesIcons.get(key, group);
          if (btn && html) btn.innerHTML = html;
        });
      })();
    </script>

    <script src="1-core-bridge.js"></script>
    <script src="2-ui-personas.js"></script>
    <script src="3-ui-toolbars.js"></script>
    <script src="4-ui-drawers.js"></script>
    <script src="5-viewport-engine.js"></script>

    <!-- Módulo Vetorial (ferramentas primeiro, orquestrador depois) -->
    <script src="js/vetor/01-move.js"></script>
    <script src="js/vetor/02-artboard.js"></script>
    <script src="js/vetor/03-corner.js"></script>
    <script src="js/vetor/04-contour.js"></script>
    <script src="js/vetor/vetor.js"></script>

    <script src="pixel.js"></script>
    <script src="video.js"></script>
    <script src="3d.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => console.log("SW registado:", reg.scope))
            .catch((err) => console.error("Falha ao registar SW:", err));
        });
      }
    </script>
  </body>
</html>
