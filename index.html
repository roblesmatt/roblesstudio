<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robles Studio — 3D Workspace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="studio-app" class="studio-shell">
    <!-- Viewport / Grade 3D -->
    <main id="viewport" class="viewport" aria-label="Área de visualização 3D">
      <canvas id="scene-canvas" class="scene-canvas"></canvas>

      <!-- Topo esquerdo: Primitivas / Ferramentas de criação -->
      <nav class="hud-pill hud-top-left" aria-label="Primitivas e criação">
        <button type="button" class="tool-btn" data-tool="grid-menu" title="Grade e layouts">⊞</button>
        <button type="button" class="tool-btn" data-tool="prim-sphere" title="Esfera">◯</button>
        <button type="button" class="tool-btn" data-tool="prim-cylinder" title="Cilindro">⬭</button>
        <button type="button" class="tool-btn" data-tool="prim-box" title="Caixa / Embalagem">⬚</button>
        <button type="button" class="tool-btn is-active" data-tool="prim-hex" title="Forma base">⬣</button>
      </nav>

      <!-- Topo centro: Câmera / Seleção / Modos -->
      <nav class="hud-pill hud-top-center" aria-label="Modos de navegação e seleção">
        <button type="button" class="tool-btn" data-mode="orbit" title="Órbita / Câmera">🌐</button>
        <button type="button" class="tool-btn is-active" data-mode="select" title="Seleção">◎</button>
        <button type="button" class="tool-btn" data-mode="face" title="Faces">◔</button>
        <button type="button" class="tool-btn" data-mode="edge" title="Arestas">◫</button>
        <button type="button" class="tool-btn" data-mode="vertex" title="Vértices">◈</button>
      </nav>

      <!-- Topo direito: Luzes / Materiais / Visualização -->
      <nav class="hud-pill hud-top-right" aria-label="Iluminação e visualização">
        <button type="button" class="tool-btn" data-view="light" title="Iluminação">☀</button>
        <button type="button" class="tool-btn" data-view="solid" title="Sólido">▣</button>
        <button type="button" class="tool-btn" data-view="wireframe" title="Malha">❖</button>
        <button type="button" class="tool-btn" data-view="material" title="Material">✺</button>
        <button type="button" class="tool-btn" data-view="environment" title="Ambiente">✳</button>
        <button type="button" class="tool-btn" data-view="settings" title="Configurações">⚙</button>
      </nav>

      <!-- Lateral esquerda: Transformação e manipulação -->
      <aside class="hud-pill hud-left" aria-label="Ferramentas de manipulação">
        <button type="button" class="tool-btn" data-action="pan" title="Mover câmera / mão">✋</button>
        <button type="button" class="tool-btn" data-action="transform" title="Transformar (Mover / Rotacionar / Escalar)">✥</button>
        <button type="button" class="tool-btn" data-action="align" title="Alinhar / Centro">⊕</button>
        <button type="button" class="tool-btn" data-action="hierarchy" title="Estrutura / Nós">⑂</button>
      </aside>

      <!-- Canto superior direito: Eixos X / Y / Z e atalhos de câmera -->
      <div class="hud-stack hud-top-right-sub" aria-label="Orientação e câmera">
        <div id="axis-gizmo" class="axis-gizmo" title="Eixos X, Y, Z">
          <span class="axis-label axis-x">X</span>
          <span class="axis-label axis-y">Y</span>
          <span class="axis-label axis-z">Z</span>
        </div>
        <button type="button" class="tool-btn hud-pill-btn" data-camera="home" title="Vista inicial">⌂</button>
        <button type="button" class="tool-btn hud-pill-btn" data-camera="frame" title="Enquadrar cena">⛶</button>
      </div>

      <!-- Canto inferior esquerdo: Navegação rápida e desfazer -->
      <div class="hud-bottom-left" aria-label="Controles de cena">
        <div class="hud-pill">
          <button type="button" class="tool-btn" data-action="hand-bottom" title="Panorâmica">✋</button>
          <button type="button" class="tool-btn" data-action="focus-grid" title="Centralizar grade">⊞</button>
        </div>
        <div class="hud-pill">
          <button type="button" class="tool-btn" data-panel="left" title="Painel esquerdo">◧</button>
          <button type="button" class="tool-btn is-active" data-panel="inspector" title="Inspetor / Propriedades">⧉</button>
          <button type="button" class="tool-btn" data-action="undo" title="Desfazer">↶</button>
        </div>
      </div>

      <!-- Canto inferior direito: Exportar, atalhos e adicionar -->
      <div class="hud-bottom-right" aria-label="Ações da cena">
        <div class="hud-stack">
          <button type="button" class="tool-btn hud-pill-btn" data-action="export" title="Exportar">⤓</button>
          <button type="button" class="tool-btn hud-pill-btn" data-action="shortcuts" title="Atalhos">⌘</button>
        </div>
        <div class="hud-pill">
          <button type="button" class="tool-btn" data-action="redo" title="Refazer">↷</button>
          <button type="button" class="tool-btn" data-action="add" title="Adicionar item">＋</button>
          <button type="button" class="tool-btn" data-panel="right" title="Painel direito">◨</button>
        </div>
      </div>
    </main>
  </div>

<script src="core.js"></script>
  <script src="vetor.js"></script>
  <script src="pixel.js"></script>
  <script src="layout.js"></script>
  <script src="video.js"></script>
<script src="3d.js"></script>
</body>
</html>
